name: napari-dinosim
channels:
  - conda-forge
dependencies:
  - python>=3.9,<3.14
  - pip
  # Core scientific stack from conda-forge
  - numpy>=1.21.0
  - magicgui>=0.5.0
  - qtpy
  - pillow>=9.0.0
  - matplotlib>=3.5.0
  - tqdm>=4.62.0
  - tifffile
  - pip:
    - torch>=2.0.0
    - torchvision>=0.15.0
    - opencv-python
    # Fresh environment: install the plugin with napari and the default Qt backend
    - -e ".[all]"
