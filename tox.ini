# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{39,310,311,312,313}-{linux,macos,windows}, lint
isolated_build=true

[gh-actions]
python =
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
deps =
    pytest>=8.3.5
    pytest-qt>=4.4.0
    pytest-xvfb>=3.0.0
    pytest-cov>=6.0
    # napari 0.10 (Python >= 3.11) requires Qt 6. Older napari still uses Qt 5.
    py39,py310: pyqt5>=5.15.11
    py311,py312,py313: PyQt6>=6.7
setenv =
    py39,py310: QT_API=pyqt5
    py39,py310: PYTEST_QT_API=pyqt5
    py311,py312,py313: QT_API=pyqt6
    py311,py312,py313: PYTEST_QT_API=pyqt6
passenv =
    CI
    GITHUB_ACTIONS
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    DISPLAY
    XAUTHORITY
    XDG_RUNTIME_DIR
    XDG_SESSION_TYPE
    QT_QPA_PLATFORM
    VTK_DEFAULT_OPENGL_WINDOW
    LP_NUM_THREADS
    PYTEST_QT_API
    USERNAME
    USER
    LOGNAME
    LNAME

commands = pytest -v --color=yes --cov=napari_dinosim --cov-report=xml --import-mode=importlib

[testenv:lint]
description = Run ruff and black checks
skip_install = true
deps =
    ruff
    black
commands =
    ruff check .
    black --check .
